name: Build debug APK

# CI is the hello-world verification path: local Gradle daemon builds fail
# on the dev VM (daemon handshake), so every push is verified here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release rule (2026-11-20): zero placeholders in the shipped app.
      # Fails the build if AI-filler / stub markers reach app/src/main.
      # Tests are excluded: a test may assert that a bad hash fails closed.
      # Runs BEFORE staging: the staged .so binaries live under
      # app/src/main/jniLibs, and grep without -I would scan binary bytes.
      - name: No placeholders in shipped source
        run: |
          if grep -rInE 'PLACEHOLDER_HASH_TO_PIN|WorkbenchPlaceholderTab|workbench_terminal_placeholder|workbench_browser_placeholder|Placeholder for|TODO|FIXME|coming soon|not implemented|lorem ipsum' app/src/main; then
            echo "Placeholder / filler strings found in app/src/main — see above"
            exit 1
          fi

      # Stage the verified PRoot native binaries into jniLibs (no binaries
      # are committed to the repo). Hashes pinned in RootfsManager and
      # hidden_files/rootfs-hashes.md; re-pin rule lives there too.
      # libproot.so links libtalloc.so.2 + libandroid-shmem.so (readelf):
      # all four files must land in jniLibs or execve fails on a real phone.
      - name: Stage PRoot native binaries into jniLibs
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a deb-tmp
          cd deb-tmp
          curl -fsSL -o proot.deb \
            https://codex-runtime-assets.pages.dev/proot_5.1.107.102_aarch64.deb
          echo "10a394b585c2fc2b2c8502544f4e5f1be581dc8bfff79e8ba62f16207423e030  proot.deb" | sha256sum -c -
          curl -fsSL -o libtalloc.deb \
            https://codex-runtime-assets.pages.dev/libtalloc_2.5.0_aarch64.deb
          echo "556591f43bb773ad8777e1a29522640866a55f95dab71914418b94a8c58ad5a7  libtalloc.deb" | sha256sum -c -
          curl -fsSL -o libandroid-shmem.deb \
            https://codex-runtime-assets.pages.dev/libandroid-shmem_0.7_aarch64.deb
          echo "0da3a24d558b93c92bcf8d611e0826a99ff96e396b148e6cdf33b47c47c57ff6  libandroid-shmem.deb" | sha256sum -c -
          ar x proot.deb
          tar -xf data.tar.xz
          cp data/data/com.termux/files/usr/bin/proot ../app/src/main/jniLibs/arm64-v8a/libproot.so
          cp data/data/com.termux/files/usr/libexec/proot/loader ../app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          echo "3621937c1c5a98d0d39ca599af573a6bc15128690606d535e8b05da00cec4f41  ../app/src/main/jniLibs/arm64-v8a/libproot.so" | sha256sum -c -
          echo "1da54355333cca3fb6ee10e3b82a24df24fb230c99241ce83809bf9e240609b5  ../app/src/main/jniLibs/arm64-v8a/libproot-loader.so" | sha256sum -c -
          mkdir -p talloc shmem
          (cd talloc && ar x ../libtalloc.deb && tar -xf data.tar.xz)
          (cd shmem && ar x ../libandroid-shmem.deb && tar -xf data.tar.xz)
          # AGP packages only *.so from jniLibs and silently drops the
          # version-suffixed libtalloc.so.2, so ship the same bytes as
          # libtalloc.so (hash unchanged) and patch libproot.so's
          # DT_NEEDED to match (patchelf --replace-needed). The runtime
          # first-run path is unaffected: it stages the unpatched
          # libtalloc.so.2 into native-stage for the unpatched proot.
          cp talloc/data/data/com.termux/files/usr/lib/libtalloc.so.2 ../app/src/main/jniLibs/arm64-v8a/libtalloc.so
          cp shmem/data/data/com.termux/files/usr/lib/libandroid-shmem.so ../app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          echo "742b438c4d09e276985a61d44164c9de207b6d8cc268f3018cb3001961bcb309  ../app/src/main/jniLibs/arm64-v8a/libtalloc.so" | sha256sum -c -
          echo "84475798e07c8174dbbfaec70a827fdb02f19ffa69a589380c13e7507fd0e731  ../app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so" | sha256sum -c -
          command -v patchelf >/dev/null || sudo apt-get install -y patchelf
          patchelf --replace-needed libtalloc.so.2 libtalloc.so ../app/src/main/jniLibs/arm64-v8a/libproot.so
          readelf -d ../app/src/main/jniLibs/arm64-v8a/libproot.so | grep -F '[libtalloc.so]' || { echo "patchelf failed: libproot.so does not need libtalloc.so"; exit 1; }
          if readelf -d ../app/src/main/jniLibs/arm64-v8a/libproot.so | grep -F 'libtalloc.so.2'; then echo "patchelf failed: libproot.so still needs libtalloc.so.2"; exit 1; fi
          chmod +x ../app/src/main/jniLibs/arm64-v8a/libproot.so ../app/src/main/jniLibs/arm64-v8a/libproot-loader.so ../app/src/main/jniLibs/arm64-v8a/libtalloc.so ../app/src/main/jniLibs/arm64-v8a/libandroid-shmem.so
          cd ..
          rm -rf deb-tmp

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: do NOT use android-actions/setup-android — its v3 default runs
      # `sdkmanager tools`, and Google removed the legacy `tools` package,
      # so that step fails with exit 1. ubuntu-latest runners already ship
      # an Android SDK ($ANDROID_HOME); install only the packages we need.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # The Linux terminal is dead on a real phone if any of the four
      # native libs is missing from the APK (libproot.so links libtalloc.so
      # — patched from libtalloc.so.2, which AGP refuses to package —
      # + libandroid-shmem.so). Assert all four are present.
      - name: Verify native libs packaged in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libproot.so' || { echo "libproot.so MISSING from APK"; exit 1; }
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libproot-loader.so' || { echo "libproot-loader.so MISSING from APK"; exit 1; }
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libtalloc.so$' || { echo "libtalloc.so MISSING from APK"; exit 1; }
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libandroid-shmem.so' || { echo "libandroid-shmem.so MISSING from APK"; exit 1; }

      # JVM unit tests (ApprovalGate, RetryPolicy, ToolCallParser,
      # SseParser): no emulator needed, so they run in the build job.
      # connectedDebugAndroidTest does NOT run these.
      - name: Run JVM unit tests and verify the production Alpine archive
        env:
          CODEX_CI_VERIFY_ALPINE: "1"
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release signing (v2.0.0): decode the release keystore from the
      # ANDROID_KEYSTORE_BASE64 secret into the repo root. The secret is
      # piped straight into base64 -d and never echoed.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      # Validate the decoded keystore WITHOUT printing any secret value:
      # only the file size and pass/fail lines are echoed. A wrong store
      # password or alias fails here; a wrong key password fails later at
      # packageRelease ("Given final block not properly padded") — that
      # distinction is the diagnosis (CI run 44640870701).
      - name: Validate release keystore
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$ANDROID_KEYSTORE_PATH" || { echo "keystore file missing or empty"; exit 1; }
          echo "keystore bytes: $(stat -c%s "$ANDROID_KEYSTORE_PATH")"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "keystore store-password or alias check FAILED"; exit 1; }
          echo "keystore store-password + alias OK"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify release APK signature and native libraries
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify "$apk"
          entries=$(unzip -Z1 "$apk")
          for lib in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            grep -Fx "lib/arm64-v8a/$lib" <<< "$entries" || { echo "$lib missing from release APK"; exit 1; }
          done

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

  emulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No jniLibs staging here: the emulator is x86_64 and the native
      # libs are arm64-v8a only, so staging them in this job is dead work.
      # The build job stages + verifies them (see "Verify native libs
      # packaged in APK" there); this job tests the JVM/Android code only.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same SDK packages as the build job; the emulator runner installs
      # the API 34 x86_64 system image itself.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      # Required by the emulator-runner README ("Remember to enable KVM
      # in your workflow before running this action"). On standard
      # GitHub-hosted runners there is no nested virtualization, so this
      # is a harmless no-op today and becomes required if the job moves
      # to a larger runner with hardware acceleration.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented smoke tests on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          enable-hw-keyboard: true
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/test-results/
            app/build/outputs/androidTest-results/
